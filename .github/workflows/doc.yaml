name: Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one deployment at a time; a newer push supersedes a pending one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build with Doxygen
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#doc
      # The result is a read-only symbolic link into the Nix store; copy the
      # pages out so that the artifact holds plain files.
      - run: cp -r --dereference --no-preserve=mode result/html _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
